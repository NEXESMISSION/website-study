   "title": "Average speed vs speed right now",
   "why": "Business questions are about NOW: “how fast are sales growing this month?”, not over 10 years. The derivative is the tool for “right now”. It is the heart of Math I: Chapters 2, 3, 4 and 5 all use it.",
   "html": "<div class=\"ex\"><b>A car trip</b>300 km in 3 hours → average speed = 300 ÷ 3 = 100 km/h.<br>But the speedometer shows the speed <b>right now</b>: maybe 120, maybe 60.</div><p>In math:</p><p><b>Average rate of change</b> = change over a long time (Unit 1).<br><b>Instantaneous rate of change</b> = the rate <b>right now</b>, at one moment.</p><div class=\"key\">To estimate the rate right now: take the average over a <b>shorter and shorter</b> interval.</div><p class=\"fr\">derivative = المشتقة = dérivée</p>",
   "ar": {
    "title": "السرعة المتوسّطة والسرعة الآن",
    "why": "أسئلة الأعمال تتعلّق بـ الآن: «بأيّ سرعة تنمو المبيعات هذا الشهر؟»، لا على 10 سنوات. المشتقة هي أداة «الآن». إنها قلب Math I: الفصول 2، 3، 4 و 5 كلها تستعملها.",
    "html": "<div class=\"ex\"><b>رحلة بالسيارة</b>300 كم في 3 ساعات ← السرعة المتوسّطة = <span class=\"m\">300 ÷ 3 = 100</span> كم/س.<br>لكن عدّاد السرعة يُظهر السرعة <b>الآن</b>: ربما 120، ربما 60.</div><p>في الرياضيات:</p><p><b>متوسّط معدّل التغيّر</b> = التغيّر على مدّة طويلة (الوحدة 1).<br><b>معدّل التغيّر اللحظي</b> (instantaneous) = المعدّل <b>الآن</b>، في لحظة واحدة.</p><div class=\"key\">لتقدير المعدّل الآن: خذ المتوسّط على مدّة <b>أقصر فأقصر</b>.</div>"
