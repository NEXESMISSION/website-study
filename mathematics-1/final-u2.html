   "html": "<p><b>Demand</b>: how many buyers want at price p. Price up → demand <b>down</b>.<br><b>Supply</b>: how many sellers offer at price p. Price up → supply <b>up</b>.<br><b>Equilibrium</b>: supply = demand.</p><div class=\"ex\"><b>Teacher’s example · steaks</b>Demand q = 20,000 − 50p · Supply q = 450p</div><div class=\"lad\"><span class=\"l\">20,000 − 50p</span><span class=\"e\">=</span><span class=\"rt\">450p</span><span class=\"l op\">+ 50p</span><span class=\"e\"></span><span class=\"rt op\">+ 50p</span><span class=\"note\">↓ same move on both sides</span><span class=\"l\">20,000</span><span class=\"e\">=</span><span class=\"rt\">500p</span><span class=\"l op\">÷ 500</span><span class=\"e\"></span><span class=\"rt op\">÷ 500</span><span class=\"note\">↓ same move on both sides</span><span class=\"l fin\">40</span><span class=\"e fin\">=</span><span class=\"rt fin\">p</span></div><p>Price p = <b>$40</b>, quantity q = 450 × 40 = <b>18,000</b> steaks.</p><p class=\"fr\">supply = العرض = offre · demand = الطلب = demande · equilibrium = التوازن = équilibre</p>",
