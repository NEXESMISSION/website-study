    { "kind": "learn", "title": "Why are we doing all this?",
      "html": "<p>In business, numbers <b>depend on</b> other numbers:</p><ul><li>More km → the taxi costs more.</li><li>Higher price → fewer people buy.</li><li>More sales → more profit (but only up to a point).</li></ul><p>Math I teaches you one big skill: <b>use numbers to take the best decision</b>. For example: which price gives the <b>biggest profit</b>?</p><div class=\"key\">The road of the course:<br>1. Functions (today) → 2. Change and slope → 3. Derivative → 4. Best price, max profit → 5. Several variables.<br>Each step needs the one before. Today is step 1.</div>",
      "ar": { "title": "لماذا نتعلّم كل هذا؟",

        "html": "<p><b>x</b> مجرّد صندوق فارغ. يمكنك أن تضع فيه أيّ رقم.</p><div class=\"ex\"><b>مثال · تاكسي</b>x = عدد الكيلومترات.<br>اليوم <span class=\"m\">x = 3</span>. غدًا <span class=\"m\">x = 10</span>.<br>قاعدة التاكسي تبقى نفسها؛ فقط x يتغيّر.</div><p>لهذا نستعمل حرفًا: <b>قاعدة واحدة تصلح لكل رحلة</b>.</p>" } },

    { "kind": "learn", "title": "A function is a machine",
      "why": "Every business problem starts with one sentence: <b>what depends on what</b>. If you can write the machine, you can predict the result <b>before</b> it happens: the cost of any trip, the profit of any month.",
      "html": "<p>You put a number <b>in</b>. One number comes <b>out</b>. That's a function.</p><div class=\"ex\"><b>Example · a taxi</b>A taxi costs 2 TND to start, plus 1 TND per km.<br>The machine is <b>f(x) = 2 + x</b>, where x = number of km.<br>3 km → f(3) = 2 + 3 = <b>5 TND</b>.</div><p class=\"fr\">Words: function = دالّة = fonction · input = المُدخَل · output = المُخرَج</p>",
      "ar": { "title": "الدالّة آلة",
        "why": "كل مسألة في الأعمال تبدأ بجملة واحدة: <b>ما الذي يعتمد على ماذا</b>. إذا عرفت كيف تكتب الآلة، يمكنك أن تتوقّع النتيجة <b>قبل</b> أن تحدث: تكلفة أيّ رحلة، ربح أيّ شهر.",
        "html": "<p>تُدخِل رقمًا، فيخرج رقم واحد. هذه هي الدالّة (function).</p><div class=\"ex\"><b>مثال · تاكسي</b>التاكسي يكلّف 2 دينار عند الانطلاق، زائد 1 دينار لكل كيلومتر.<br>الآلة هي <span class=\"m\"><b>f(x) = 2 + x</b></span>، حيث x = عدد الكيلومترات.<br>3 كم ← <span class=\"m\">f(3) = 2 + 3 = 5</span> دنانير.</div><p class=\"fr\">كلمات: function = دالّة · input = المُدخَل · output = المُخرَج</p>" } },

    { "kind": "learn", "title": "Linear function = same change every step",
      "why": "Many real costs grow by the same amount each step: a salary per hour, a phone plan per minute, a taxi per km. When you see this, you can write the formula in 10 seconds and predict anything.",
      "html": "<p>Look at the table again: 5, 8, 11, 14, 17. Each step adds <b>+3</b>.</p><p>When the output changes by the <b>same amount</b> each step, the function is <b>linear</b> (its graph is a straight line).</p><div class=\"formula\">f(x) = b + m·x</div><p><b>b</b> = the start (value when x = 0) = 5<br><b>m</b> = the change per step = <b>slope</b> = 3<br>So f(x) = 5 + 3x.</p><p class=\"fr\">Words: linear = خطّية = linéaire (affine) · slope = الميل = pente · intercept = القيمة الابتدائية = ordonnée à l'origine</p>",
      "ar": { "title": "الدالّة الخطّية = نفس التغيّر في كل خطوة",
        "why": "تكاليف حقيقية كثيرة تزيد بنفس المقدار في كل خطوة: أجر لكل ساعة، اشتراك هاتف لكل دقيقة، تاكسي لكل كيلومتر. عندما ترى هذا، تكتب الصيغة في 10 ثوانٍ وتتوقّع أيّ شيء.",
        "html": "<p>انظر إلى الجدول مرة أخرى: <span class=\"m\">5, 8, 11, 14, 17</span>. كل خطوة تضيف <b class=\"m\">+3</b>.</p><p>عندما يتغيّر المُخرَج <b>بنفس المقدار</b> في كل خطوة، تكون الدالّة <b>خطّية</b> (linear)، ورسمها خط مستقيم.</p><div class=\"formula\">f(x) = b + m·x</div><p><b>b</b> = البداية (القيمة عندما <span class=\"m\">x = 0</span>) = 5<br><b>m</b> = التغيّر في كل خطوة = <b>الميل</b> (slope) = 3<br>إذن <span class=\"m\">f(x) = 5 + 3x</span>.</p><p class=\"fr\">كلمات: linear = خطّية · slope = الميل · intercept = القيمة الابتدائية</p>" } },

    { "kind": "learn", "title": "Slope from two points",
      "why": "Often you only know two moments: sales in 2020 and sales in 2024. The slope tells you the <b>speed</b> of change, and with the speed you can predict the future.",
      "html": "<div class=\"formula\">m = (y₂ − y₁) ÷ (x₂ − x₁)</div><p>“Change in output ÷ change in input.”</p><div class=\"ex\"><b>Example</b>Points (2, 9) and (6, 21).<br>m = (21 − 9) ÷ (6 − 2) = 12 ÷ 4 = <b>3</b>.<br>Then b: 9 = b + 3×2 → b = 3.<br>Line: <b>y = 3 + 3x</b>.</div>",
      "ar": { "title": "الميل من نقطتين",
        "why": "غالبًا تعرف لحظتين فقط: المبيعات في 2020 والمبيعات في 2024. الميل يعطيك <b>سرعة</b> التغيّر، وبالسرعة يمكنك أن تتوقّع المستقبل.",
        "html": "<div class=\"formula\">m = (y₂ − y₁) ÷ (x₂ − x₁)</div><p>«التغيّر في المُخرَج ÷ التغيّر في المُدخَل».</p><div class=\"ex\"><b>مثال</b>النقطتان <span class=\"m\">(2, 9)</span> و <span class=\"m\">(6, 21)</span>.<br><span class=\"m\">m = (21 − 9) ÷ (6 − 2) = 12 ÷ 4 = 3</span>.<br>ثم b: <span class=\"m\">9 = b + 3×2</span> ← <span class=\"m\">b = 3</span>.<br>المستقيم: <span class=\"m\"><b>y = 3 + 3x</b></span>.</div>" } },

    { "kind": "learn", "title": "What slope and intercept MEAN",
      "why": "“How much more for one extra unit” is THE idea of this course. Later it becomes the derivative, and in Micro it's called marginal cost. Learn it once here, use it everywhere.",
      "html": "<div class=\"ex\"><b>Example · taxi</b>C = 2 + 1.5d (C in TND, d in km)</div><p><b>Intercept 2</b> (TND): the cost when d = 0, the fixed charge to start.</p><p><b>Slope 1.5</b> (TND <b>per km</b>): each extra km adds 1.5 TND.</p><div class=\"key\">Slope units = output unit PER input unit. The teacher always asks for units: you lose points without them.</div>",
      "ar": { "title": "ماذا يعني الميل والقيمة الابتدائية",
        "why": "«كم يزيد مقابل وحدة إضافية واحدة» هي الفكرة الأهم في هذه المادة. لاحقًا تصبح المشتقة (derivative)، وفي مادة Micro تُسمّى التكلفة الحدّية (marginal cost). تعلّمها مرة هنا، واستعملها في كل مكان.",
        "html": "<div class=\"ex\"><b>مثال · تاكسي</b><span class=\"m\">C = 2 + 1.5d</span> (C بالدينار، d بالكيلومتر)</div><p><b>القيمة الابتدائية 2</b> (intercept، بالدينار): التكلفة عندما <span class=\"m\">d = 0</span>، أي ثمن الانطلاق الثابت.</p><p><b>الميل 1.5</b> (slope، دينار <b>لكل كيلومتر</b>): كل كيلومتر إضافي يضيف 1.5 دينار.</p><div class=\"key\">وحدة الميل = وحدة المُخرَج <b>لكل</b> وحدة مُدخَل. الأستاذة تطلب الوحدات دائمًا: تخسر نقاطًا بدونها.</div>" } },

    { "kind": "learn", "title": "Comparing two offers",

      "html": "<div class=\"ex\"><b>Example · printing</b>Offer A: 30 TND + 0.05 TND per page → A = 30 + 0.05x<br>Offer B: 90 TND + 0.02 TND per page → B = 90 + 0.02x</div><p><b>Same cost when A = B:</b><br>30 + 0.05x = 90 + 0.02x<br>0.03x = 60 → x = <b>2000 pages</b>.</p><p>Fewer than 2000 pages → A is cheaper. More → B is cheaper.</p>",
      "ar": { "title": "مقارنة عرضين",
        "why": "الاختيار بين عرضين (اشتراكَي هاتف، مورّدَين، الكراء أو الشراء) قرار حقيقي ستتّخذه في العمل وفي البيت. وضع <span class=\"m\">A = B</span> يبيّن بالضبط متى يصبح عرض أفضل من الآخر.",
        "html": "<div class=\"ex\"><b>مثال · طباعة</b>العرض A: 30 دينارًا + 0.05 دينار لكل صفحة ← <span class=\"m\">A = 30 + 0.05x</span><br>العرض B: 90 دينارًا + 0.02 دينار لكل صفحة ← <span class=\"m\">B = 90 + 0.02x</span></div><p><b>نفس التكلفة عندما <span class=\"m\">A = B</span>:</b><br><span class=\"m\">30 + 0.05x = 90 + 0.02x</span><br><span class=\"m\">0.03x = 60</span> ← <span class=\"m\">x = 2000</span> صفحة.</p><p>أقل من 2000 صفحة ← A أرخص. أكثر ← B أرخص.</p>" } },

    { "kind": "learn", "title": "Average rate of change",
      "why": "Reports and the news say things like “grew by 86 million per year”. That's an average rate of change, and last year's midterm asked this kind of question.",
      "html": "<p>For ANY function (not only lines), between two points:</p><div class=\"formula\">average rate = change in output ÷ change in input</div><div class=\"ex\"><b>Example · like the midterm</b>Smartphones made: 50 million (2005) → 2200 million (2030).<br>Change = 2200 − 50 = 2150 million.<br>Average rate = 2150 ÷ 25 years = <b>86 million per year</b>.<br>Meaning: on average, production grew by 86 million phones each year.</div>",
      "ar": { "title": "متوسّط معدّل التغيّر",

        "html": "<p>لأيّ دالّة (ليس فقط المستقيمات)، بين نقطتين:</p><div class=\"key\">متوسّط المعدّل = التغيّر في المُخرَج ÷ التغيّر في المُدخَل</div><div class=\"ex\"><b>مثال · مثل الـ midterm</b>الهواتف الذكية المصنوعة: 50 مليون (2005) ← 2200 مليون (2030).<br>التغيّر = <span class=\"m\">2200 − 50 = 2150</span> مليون.<br>متوسّط المعدّل = <span class=\"m\">2150 ÷ 25 = 86</span> مليون في السنة.<br>المعنى: في المتوسّط، زاد الإنتاج بـ 86 مليون هاتف كل سنة.</div>" } },
