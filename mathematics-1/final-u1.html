   "why": "“How much more for one extra unit” is THE idea of this course. Later it becomes the derivative, and in Micro it's called marginal cost. Learn it once here, use it everywhere.",
   "html": "<div class=\"ex\"><b>Example · taxi</b>C = 2 + 1.5d (C in TND, d in km)</div><p><b>Start 2</b> (math word: <b>intercept</b>, TND): the cost when d = 0, the fixed charge to start.</p><p><b>Jump 1.5</b> (math word: <b>slope</b>, TND <b>per km</b>): each extra km adds 1.5 TND.</p><div class=\"key\">Slope units = output unit PER input unit. The teacher always asks for units: you lose points without them.</div>",

    "html": "<div class=\"ex\"><b>مثال · تاكسي</b><span class=\"m\">C = 2 + 1.5d</span> (C بالدينار، d بالكيلومتر)</div><p><b>القيمة الابتدائية 2</b> (intercept، بالدينار): التكلفة عندما <span class=\"m\">d = 0</span>، أي ثمن الانطلاق الثابت.</p><p><b>القفزة 1.5</b> (الميل، slope، دينار <b>لكل كيلومتر</b>): كل كيلومتر إضافي يضيف 1.5 دينار.</p><div class=\"key\">وحدة الميل = وحدة المُخرَج <b>لكل</b> وحدة مُدخَل. الأستاذة تطلب الوحدات دائمًا: تخسر نقاطًا بدونها.</div>"

   "why": "Every “when will…?” or “how many…?” question ends with an equation: when will the profit reach 13 million? How many pages for the same price? Solving is how you get the answer.",
   "html": "<p>An equation is a <b>balance</b>: both sides weigh the same. Whatever you do to one side, do it to the other side too.</p><p>To find x, <b>undo</b> what was done to x, one move at a time. The purple move is done under <b>both</b> sides:</p><div class=\"lad\"><span class=\"l\">2 + 3x</span><span class=\"e\">=</span><span class=\"rt\">14</span><span class=\"l op\">− 2</span><span class=\"e\"></span><span class=\"rt op\">− 2</span><span class=\"note\">↓ same move on both sides</span><span class=\"l\">3x</span><span class=\"e\">=</span><span class=\"rt\">12</span><span class=\"l op\">÷ 3</span><span class=\"e\"></span><span class=\"rt op\">÷ 3</span><span class=\"note\">↓ same move on both sides</span><span class=\"l fin\">x</span><span class=\"e fin\">=</span><span class=\"rt fin\">4</span></div><p>Check: 2 + 3×4 = 14 ✓</p><div class=\"key\">Opposite moves: − undoes +, and ÷ undoes ×.</div>",

   "why": "Almost every exam question that ends with “find x” (or q, t, p) is solved with these few undo moves. Learn this table once and you can solve them all.",
   "html": "<p>Each operation has an <b>opposite</b> that cancels it:</p><div class=\"tbl\"><table><tr><th>Done to x</th><th>Undo it with</th></tr><tr><td>+ 5</td><td>− 5</td></tr><tr><td>− 5</td><td>+ 5</td></tr><tr><td>× 5</td><td>÷ 5</td></tr><tr><td>÷ 5</td><td>× 5</td></tr><tr><td>x²</td><td>√ (square root)</td></tr><tr><td>√x</td><td>square it ( )²</td></tr><tr><td>eˣ</td><td>ln</td></tr><tr><td>aᵗ (t in the power)</td><td>ln: the power t comes down</td></tr><tr><td>ln x</td><td>e<sup>□</sup></td></tr></table></div><div class=\"key\">Golden rule: whatever you do to one side, do exactly the same to the other side.</div>",

    "html": "<p>كل عملية لها <b>عكس</b> يلغيها:</p><div class=\"tbl\"><table><tr><th>ما فُعل بـ x</th><th>نلغيه بـ</th></tr><tr><td>+ 5</td><td>− 5</td></tr><tr><td>− 5</td><td>+ 5</td></tr><tr><td>× 5</td><td>÷ 5</td></tr><tr><td>÷ 5</td><td>× 5</td></tr><tr><td>x²</td><td>√ (الجذر التربيعي)</td></tr><tr><td>√x</td><td>( )² نربّعه</td></tr><tr><td>eˣ</td><td>ln</td></tr><tr><td>aᵗ (t في الأُسّ)</td><td>ln: الأُسّ t ينزل</td></tr><tr><td>ln x</td><td>e<sup>□</sup></td></tr></table></div><div class=\"key\">القاعدة الذهبية: ما تفعله بجهة، افعله بالضبط بالجهة الأخرى.</div>"

   "why": "Average cost = total cost ÷ quantity. When the question asks “for which quantity is the average cost 5 TND?”, the unknown is at the bottom.",
   "html": "<p><b>Story:</b> 12 TND shared between x friends, each friend gets 4 TND. How many friends? 12 ÷ 4 = <b>3</b>.</p><p>The same thing with the balance. x is stuck at the bottom, so multiply both sides by x. On the left, ÷ x and × x cancel:</p><div class=\"lad\"><span class=\"l\">12 ÷ x</span><span class=\"e\">=</span><span class=\"rt\">4</span><span class=\"l op\">× x</span><span class=\"e\"></span><span class=\"rt op\">× x</span><span class=\"note\">↓ same move on both sides</span><span class=\"l\">12</span><span class=\"e\">=</span><span class=\"rt\">4x</span><span class=\"l op\">÷ 4</span><span class=\"e\"></span><span class=\"rt op\">÷ 4</span><span class=\"note\">↓ same move on both sides</span><span class=\"l fin\">3</span><span class=\"e fin\">=</span><span class=\"rt fin\">x</span></div><div class=\"key\">Shortcut: when x is at the bottom, swap x and the answer:<br>12 ÷ x = 4 → x = 12 ÷ 4 = 3<br>Trap: NOT 12 × 4. Check: 12 ÷ 48 is not 4.</div>",

    "title": "x في أسفل الكسر",

    "html": "<p><b>قصّة:</b> 12 دينارًا تُقسَم على x أصدقاء، وكل صديق يأخذ 4 دنانير. كم عدد الأصدقاء؟ <span class=\"m\">12 ÷ 4 = 3</span>.</p><p>نفس الشيء بالميزان. x عالق في الأسفل، إذن اضرب الجهتين في x. في اليسار، <span class=\"m\">÷ x</span> و <span class=\"m\">× x</span> يلغي أحدهما الآخر:</p><div class=\"lad\"><span class=\"l\">12 ÷ x</span><span class=\"e\">=</span><span class=\"rt\">4</span><span class=\"l op\">× x</span><span class=\"e\"></span><span class=\"rt op\">× x</span><span class=\"note\" dir=\"rtl\">↓ نفس الحركة على الجهتين</span><span class=\"l\">12</span><span class=\"e\">=</span><span class=\"rt\">4x</span><span class=\"l op\">÷ 4</span><span class=\"e\"></span><span class=\"rt op\">÷ 4</span><span class=\"note\" dir=\"rtl\">↓ نفس الحركة على الجهتين</span><span class=\"l fin\">3</span><span class=\"e fin\">=</span><span class=\"rt fin\">x</span></div><div class=\"key\">اختصار: عندما يكون x في الأسفل، بدّل بين x والجواب:<br><span class=\"m\">12 ÷ x = 4 → x = 12 ÷ 4 = 3</span><br>فخّ: ليس <span class=\"m\">12 × 4</span>. تحقّق: <span class=\"m\">12 ÷ 48</span> لا يساوي 4.</div>"
