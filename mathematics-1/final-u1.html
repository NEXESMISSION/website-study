    { "kind": "learn", "title": "A function is a machine",
      "html": "<p>You put a number <b>in</b>. One number comes <b>out</b>. That's a function.</p><div class=\"ex\"><b>Example · a taxi</b>A taxi costs 2 TND to start, plus 1 TND per km.<br>The machine is <b>f(x) = 2 + x</b>, where x = number of km.<br>3 km → f(3) = 2 + 3 = <b>5 TND</b>.</div><p class=\"fr\">In French: une fonction.</p>" },
    { "kind": "number", "title": "Your turn",
      "html": "<p>With <b>f(x) = 2 + x</b>, what is <b>f(7)</b>?</p>",
      "answer": 9, "tol": 0, "unit": "TND",
      "hint": "Replace x by 7: f(7) = 2 + 7.",
      "explain": "f(7) = 2 + 7 = <b>9</b>. A 7 km taxi ride costs 9 TND." },
    { "kind": "learn", "title": "How to read f(…)",
      "html": "<p><b>f(5)</b> means: take the formula and put <b>5</b> everywhere you see x.</p><div class=\"ex\"><b>Example</b>f(x) = 3x + 1<br>f(2) = 3×2 + 1 = 7<br>f(0) = 3×0 + 1 = 1<br>f(−1) = 3×(−1) + 1 = −2</div><div class=\"key\">3x means 3 × x.</div>" },
    { "kind": "number", "title": "Your turn",
      "html": "<p>f(x) = 3x + 1. What is <b>f(4)</b>?</p>",
      "answer": 13, "tol": 0,
      "hint": "3 × 4 first, then add 1.",
      "explain": "f(4) = 3 × 4 + 1 = 12 + 1 = <b>13</b>." },
    { "kind": "mcq", "title": "Your turn",
      "html": "<p>g(x) = x² − 1. What is <b>g(3)</b>?</p>",
      "options": ["5", "8", "9", "6"], "answer": 1,
      "hint": "x² means x × x. So 3² = 3 × 3. Then subtract 1.",
      "explain": "g(3) = 3² − 1 = 9 − 1 = <b>8</b>. (5 is the trap 3 × 2 − 1: x² is NOT x × 2.)" },
    { "kind": "learn", "title": "Functions in real life say something",
      "html": "<p>In exams, the teacher asks: <b>“explain in words”</b>. Say what goes in, what comes out, <b>with the units</b>.</p><div class=\"ex\"><b>Example</b>C(q) = cost in TND of making q sandwiches.<br><b>C(10) = 25</b> means: “making <b>10 sandwiches</b> costs <b>25 TND</b>.”</div>" },
    { "kind": "mcq", "title": "Your turn",
      "html": "<p>P(t) = population of Sfax in <b>thousands</b>, t = years since 2020.<br>What does <b>P(5) = 980</b> mean?</p>",
      "options": ["In 2025, Sfax has 980,000 people.", "In 5 years, the population grows by 980 people.", "In 2020, Sfax has 980 people.", "The population grows 5% per year."],
      "answer": 0,
      "hint": "t = 5 means 5 years after 2020. And P is in thousands.",
      "explain": "t = 5 → the year 2020 + 5 = <b>2025</b>. P = 980 thousand = <b>980,000 people</b>. So: in 2025, Sfax has 980,000 people." },
    { "kind": "learn", "title": "Functions in a table",
      "html": "<p>A table also shows a function: input on top, output below.</p><div class=\"tbl\"><table><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>f(x)</th><td>5</td><td>8</td><td>11</td><td>14</td><td>17</td></tr></table></div><p><b>f(2)</b>: look under x = 2 → <b>11</b>.</p><p><b>f(x) = 14</b>: find 14 in the bottom row → x = <b>3</b>.</p>" },
    { "kind": "number", "title": "Your turn",
      "html": "<div class=\"tbl\"><table><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>f(x)</th><td>5</td><td>8</td><td>11</td><td>14</td><td>17</td></tr></table></div><p>What is <b>f(4)</b>?</p>",

    { "kind": "number", "title": "Your turn",
      "html": "<div class=\"tbl\"><table><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>f(x)</th><td>5</td><td>8</td><td>11</td><td>14</td><td>17</td></tr></table></div><p>For which x is <b>f(x) = 8</b>?</p>",
      "answer": 1, "tol": 0,
      "hint": "This time 8 is the OUTPUT. Find 8 in the bottom row, then read x above it.",
      "explain": "8 is in the bottom row under x = <b>1</b>. So f(1) = 8." },
    { "kind": "learn", "title": "Linear function = same change every step",
      "html": "<p>Look at the table again: 5, 8, 11, 14, 17. Each step adds <b>+3</b>.</p><p>When the output changes by the <b>same amount</b> each step, the function is <b>linear</b> (its graph is a straight line).</p><div class=\"formula\">f(x) = b + m·x</div><p><b>b</b> = the start (value when x = 0) = 5<br><b>m</b> = the change per step = <b>slope</b> = 3<br>So f(x) = 5 + 3x.</p><p class=\"fr\">In French: fonction linéaire (affine), pente = slope, ordonnée à l'origine = intercept.</p>" },
    { "kind": "mcq", "title": "Your turn",
      "html": "<p>Which list of outputs comes from a <b>linear</b> function (x = 0, 1, 2, 3)?</p>",
      "options": ["2, 4, 8, 16", "10, 7, 4, 1", "1, 4, 9, 16", "3, 5, 9, 15"],
      "answer": 1,
      "hint": "Compute the change between neighbours: is it always the same number?",
      "explain": "10 → 7 → 4 → 1: always <b>−3</b>, the same change, so it is linear. 2, 4, 8, 16 doubles (that's exponential, Unit 3). 1, 4, 9, 16 and 3, 5, 9, 15 change by different amounts." },
    { "kind": "learn", "title": "Slope from two points",
      "html": "<div class=\"formula\">m = (y₂ − y₁) ÷ (x₂ − x₁)</div><p>“Change in output ÷ change in input.”</p><div class=\"ex\"><b>Example</b>Points (2, 9) and (6, 21).<br>m = (21 − 9) ÷ (6 − 2) = 12 ÷ 4 = <b>3</b>.<br>Then b: 9 = b + 3×2 → b = 3.<br>Line: <b>y = 3 + 3x</b>.</div>" },
    { "kind": "number", "title": "Your turn",

      "explain": "m = (16 − 4) ÷ (5 − 1) = 12 ÷ 4 = <b>3</b>." },
    { "kind": "number", "title": "Your turn",
      "html": "<p>Slope of the line through <b>(0, 10)</b> and <b>(4, 2)</b>?</p>",

    { "kind": "learn", "title": "What slope and intercept MEAN",
      "html": "<div class=\"ex\"><b>Example · taxi</b>C = 2 + 1.5d (C in TND, d in km)</div><p><b>Intercept 2</b> (TND): the cost when d = 0, the fixed charge to start.</p><p><b>Slope 1.5</b> (TND <b>per km</b>): each extra km adds 1.5 TND.</p><div class=\"key\">Slope units = output unit PER input unit. The teacher always asks for units: you lose points without them.</div>" },
    { "kind": "mcq", "title": "Your turn · like the midterm",

    { "kind": "number", "title": "Your turn",

    { "kind": "learn", "title": "Comparing two plans",
      "html": "<div class=\"ex\"><b>Example · printing</b>Plan A: 30 TND + 0.05 TND per page → A = 30 + 0.05x<br>Plan B: 90 TND + 0.02 TND per page → B = 90 + 0.02x</div><p><b>Same cost when A = B:</b><br>30 + 0.05x = 90 + 0.02x<br>0.03x = 60 → x = <b>2000 pages</b>.</p><p>Fewer than 2000 pages → A is cheaper. More → B is cheaper.</p>" },
    { "kind": "number", "title": "Your turn",

    { "kind": "mcq", "title": "Your turn",
